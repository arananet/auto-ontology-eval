name: auto-ontology-eval

# Executed evaluation of NVIDIA Auto Ontology (spec auto-ontology-enterprise-eval).
# Runs the harness end to end on a Docker-capable GitHub-hosted runner. The
# hosted NIM key reaches the job only from the repository secret
# NVIDIA_API_KEY and is never printed. Evidence is uploaded as a workflow
# artifact; nothing is published.
#
# Dispatch inputs (spec Amendment 3): the defaults reproduce the default
# configuration run exactly. The live-internals configuration is dispatched
# with configuration=live-internals and run_dir=runs/eval-live.
on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Run configuration: default, or live-internals (spec Amendment 3)"
        type: choice
        options:
          - default
          - live-internals
        default: default
        required: true
      run_dir:
        description: "Evidence directory for this run, relative to the workspace"
        type: string
        default: runs/eval
        required: true

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install harness dependencies
        run: python -m pip install "duckdb==1.5.5"

      - name: Offline scenario tests
        run: python -m unittest discover -s tests -t .

      - name: Run the evaluation (fails closed)
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        # The run dir is absolute on purpose: the harness passes its
        # compose override to docker compose as a path derived from the
        # run dir, while compose executes from the upstream checkout
        # directory. A relative run dir made compose resolve the
        # override against the upstream directory and fail at S1
        # (attempt run 42126844035, evidence in runs/eval-attempts/).
        run: PYTHONPATH=src python -m auto_ontology_eval --run-dir "${GITHUB_WORKSPACE}/${{ inputs.run_dir }}" --upstream-dir "${RUNNER_TEMP}/auto-ontology" --configuration "${{ inputs.configuration }}"

      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-ontology-eval-evidence
          path: ${{ inputs.run_dir }}
          if-no-files-found: warn
