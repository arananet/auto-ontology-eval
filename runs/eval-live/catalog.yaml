    columns_attributes:
    - id: 1419fbc0-bf69-4750-a543-5e12129a79ac
      name: Units Sold
      description: units is an integer column tracking quantities sold per transaction,
        with sample values ranging from 14 to 52.
      column_id: 39d80f90-1211-4b9b-8714-4addac593320
    - id: 2b5e59c1-d439-4710-8192-2c44e7742b19
      name: Store Location ID
      description: location_id is an integer foreign key referencing store locations,
        with sample values 3 and 4.
      column_id: 7875a52b-23bc-4f38-85e1-8b0e7904b32f
    - id: 771a4948-1d5c-48df-9a90-7c54503219c2
      name: Gross Sales
      description: gross_sales is a numeric column recording total revenue before
