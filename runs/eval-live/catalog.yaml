      column_id: 66e24a8d-95d4-4ccf-8015-7257d9bc359c
    - id: b36234b0-67e6-479f-9a1e-045050301c88
      name: Sale Date
      description: "sale_date is a date field recording the transaction date for each\
        \ sales event. \u2014 format: YYYY-MM-DD"
      column_id: ced4f6fb-994a-4e97-8609-435ff977eda2
    - id: bd3eb36c-72af-4266-9d99-2953bcb4ae08
