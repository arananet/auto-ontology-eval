semantic_layer:
  terms:
  - id: c4026dd6-c698-461b-95c7-628614c1e38a
    name: Distribution Center
    description: Represents a physical or logical site where goods are stored and
      dispatched.
    represents:
    - 26d9dbca-186c-4042-9cf5-e5a80df8d7d8
    columns_attributes:
    - id: 253293cb-e171-4a47-90fb-3617c9f135a0
      name: Distribution Center Code
      description: dc_code is a VARCHAR text field storing distribution center identifiers
        such as DC-N1 and DC-S1.
      column_id: 3320674f-e5b8-4ad5-86c2-8c3a6065d504
    - id: 5e964078-2807-4dea-b546-5b4b810fa831
      name: Distribution Center City
      description: dc_city is a VARCHAR text field recording city names like Rotterdam
        and Milan for each location.
      column_id: d7a45db4-eb2e-4cf9-a24d-750864641a81
    - id: 8b2eece5-ed28-43c9-9682-a18f687d4ae0
      name: Distribution Center Region
      description: region is a VARCHAR text field assigning geographical designations
        such as North and South.
      column_id: 94fd6a89-62fe-4127-a8c1-f31ec1b91938
  - id: 9152ccc6-2685-4fa9-9b79-6ca78332d1ea
    name: Item
    description: Core product/item record
    represents:
    - d616187f-b1c9-4561-9853-06c51f9024d5
    columns_attributes:
    - id: 42c2f2fa-8406-4919-9188-356da3b562ef
      name: Item Description
      description: '`item_description` (VARCHAR): The `item_description` column contains
        human-readable product labels (e.g., ALPINE SPRING SPARKLING 1L) specifying
        flavor and packaging size.'
      column_id: 86beabbc-7384-46bd-9486-b5a1c31a8987
    - id: 5eece240-8f1b-4d64-8e28-fac06a24d9d1
      name: Item Sku
      description: '`item_sku` (VARCHAR): The `item_sku` column stores unique product
        identifiers (e.g., SKU-1002, SKU-1003) for individual sellable units.'
      column_id: 95d4ca75-786e-4bba-9d73-c810f9fa58de
    - id: fac26e14-fc13-40c8-b238-588fdb2b46fe
      name: Product Group
      description: '`product_group` (VARCHAR): The `product_group` column classifies
        products by storage condition (e.g., Chilled, Ambient).'
      column_id: ca93de21-4a44-4841-877d-90087aaefd67
  - id: b6251d8c-02ae-4967-9a98-29b9076db66d
    name: Location
    description: ''
    represents:
    - a0972a97-04e7-4e4d-a272-3df9b482f3a8
    columns_attributes:
    - id: 2241c117-0cda-461f-b2ba-731061e5e00d
      name: Location Kind
      description: ''
      column_id: 27357834-81e9-4a3d-9866-c8104d8b60a8
    - id: 23429fea-b4d4-4121-ab3b-91f82d5908aa
      name: City
      description: ''
      column_id: 49dc3b46-809b-4135-bbd4-3dbb5c06bced
    - id: 5b890cc8-ae22-4e58-a376-8edb68ef0bbf
      name: Location Name
      description: The location_name column stores the textual name of each site,
        combining a city reference with a facility type such as
      column_id: a0f5c0e7-4c78-4281-9161-679c920319ee
    - id: 7ad5e2da-dce5-4ed4-8f3f-40bd31c98828
      name: Location ID
      description: "The location_id column assigns a unique integer identifier (1\u2013\
        4) to each facility site, serving as the primary key for distinguishing operational\
        \ locations."
      column_id: df8f4951-35f4-418b-a6dd-24375a8c1bb6
  - id: a031ace8-ee2a-41b9-a54b-742d56b28b33
    name: Product
    description: Core product entity capturing catalog items and their attributes.
    represents:
    - 948f7aac-3ebd-440e-b9f7-5beff0fdd5b5
    columns_attributes:
    - id: 7355f9ee-3c3c-4753-8508-f696fa48c9b2
      name: Product Name
      description: The product_name column (text) lists the consumer-facing product
        names exemplified by Alpine Spring Still 1L, Alpine Spring Sparkling 1L, and
        Nordwind Apple Juice 1L, representing what appears on shelf labels.
      column_id: 843e7697-10e3-4cae-bfad-7848af4180fe
    - id: 7d5d9269-55ed-4d4b-b22c-43d4ace41f07
      name: Product SKU
      description: The sku column (text) contains unique product identifiers such
        as SKU-1001 through SKU-1005, serving as the catalog's primary key for each
        distinct item.
      column_id: 9c628899-2d79-4094-83ca-ee47deb2ff82
    - id: 91adb777-2652-4dfe-a991-da23befae12e
      name: List Price
      description: The list_price column (numeric) captures the retail selling price
        per unit with sample values of 0.9, 1.2, 1.4, 2.6, and 2.8, representing the
        amount at which items are offered for sale.
      column_id: 9179f289-ab2a-4137-8ed1-7d60f4a01ade
    - id: 92e0fa03-f325-4104-a1d9-772afada828e
      name: Brand
      description: The brand column (text) records the manufacturer label with samples
        including Alpine Spring, Nordwind, and Sol Mar, indicating the source company
        behind each product.
      column_id: eba2a8a5-a764-4a79-9ab7-8932c0a9899e
    - id: df7bf59d-d0d1-4217-911e-5a3c1f38b2af
      name: Category
      description: The category column (text) classifies products into business groupings
        such as Soda, Juice, and Water, reflecting the product type hierarchy used
        for analysis.
      column_id: 2f9a25a7-54e9-4136-bddb-eb17078f0316
  - id: 19596c55-98c2-49a6-8846-3e6a9b3cda63
    name: Production Plant
    description: ''
    represents:
    - 0bf31d6b-7f7d-4b1e-abdf-005feaf51519
    columns_attributes:
    - id: 37128fd5-4b6f-49bc-a1aa-120804e2cb4c
      name: Plant City
      description: plant_city records the city where the production plant is physically
        located, for example Lyon or Porto.
      column_id: 8609affe-e1ef-45f4-8d24-1087746b61b5
    - id: 69918991-27e7-4f93-909c-83c8ebd2c16c
      name: Capacity Units
      description: capacity_units quantifies the maximum production or storage capacity
        of the plant in whole units, such as 12000 or 8000.
      column_id: 503c7b65-54f2-43c4-aac4-a20a0d80a574
    - id: c6654e70-c6a8-46b1-9227-2b8aca842675
