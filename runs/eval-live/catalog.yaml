      description: plant_code functions as a unique business identifier for each production
        plant, using alphanumeric codes such as PL01 and PL02.
      column_id: 91b8f799-ae20-41d6-9187-8e1c53be5736
  - id: 0df9b11a-4d9b-40d2-85d6-f29633aee9cc
    name: Sale
    description: ''
    represents:
